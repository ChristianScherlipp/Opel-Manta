<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opel Manta</title>
    <link rel="stylesheet" href="./styles/header.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/footer.css" />
    <link rel="stylesheet" href="./styles/globalStandards.css" />
    <link rel="stylesheet" href="./styles/fonts/font.css" />
    <link rel="stylesheet" href="./styles/folder.css" />
    <link rel="shortcut icon" href="./assets/icons/opel_Manta.svg" type="image/x-icon" />
  </head>
  <body onload="init()">

    <!-- HEADER bleibt fest im HTML -->
    <header class="header" id="hero">
      <nav class="header-nav">
        <section class="header-icon">
          <img src="./assets/icons/opel_Manta.svg" alt="Das Logo von Opel" />
          <p class="header-name"><strong>MANTA</strong></p>
        </section>
        <ul>
          <li><a href="#galerie">GESCHICHTE</a></li>
          <li><a href="#galerie">MODELLE</a></li>
          <li><a href="#galerie">GALERIE</a></li>
        </ul>
      </nav>
      <!-- Hero-Inhalt wird dynamisch gerendert -->
      <div id="hero-content"></div>
    </header>

    <main class="main">
      <!-- Galerie-Nav wird dynamisch gerendert -->
      <div id="galerie-nav"></div>

      <!-- Folder-Animation wird dynamisch gerendert -->
      <div id="folder-root"></div>
    </main>

    <!-- Dialog wird dynamisch gerendert -->
    <div id="dialog-root"></div>

    <footer class="footer">
      <button class="impressum">Impressum</button>
    </footer>

    <script src="./scripts/galery.js"></script>
    <script src="./scripts/templates.js"></script>
    <script src="./scripts/basic.js"></script>
    <script src="./scripts/gallery-dialog.js"></script>
  </body>
</html>
